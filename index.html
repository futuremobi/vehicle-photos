<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vehicle Photo Checklist</title>
<script src="https://script.google.com/macros/s/AKfycby7mnxCSdvqqlZKmjo-qOQp2gJ3agVjcFiRm6exXT7nAOJkLbrLKDKfSLhSZ6ToMd2q/exec"></script>
<style>
  body { font-family: -apple-system, sans-serif; padding: 16px; background: #f5f5f5; margin:0; }
  h2 { font-size: 18px; margin-bottom: 4px; }
  .vehicle { color: #666; margin-bottom: 20px; font-size: 14px; }
  .step { background: #fff; border-radius: 12px; padding: 14px; margin-bottom: 10px;
          display: flex; align-items: center; justify-content: space-between; }
  .step.done { border: 2px solid #34c759; }
  .step-label { font-weight: 600; font-size: 15px; }
  .step-status { font-size: 13px; color: #999; }
  .step.done .step-status { color: #34c759; }
  button.capture { background: #2481cc; color: #fff; border: none; border-radius: 8px;
                    padding: 8px 14px; font-size: 14px; }
  button.capture:disabled { background: #ccc; }
  #submitBtn { width: 100%; padding: 14px; background: #34c759; color: #fff; border: none;
               border-radius: 12px; font-size: 16px; margin-top: 16px; }
  #submitBtn:disabled { background: #ccc; }
  #statusMsg { text-align: center; margin-top: 12px; font-size: 14px; color: #666; }
  input[type=file] { display: none; }
</style>
</head>
<body>

<h2>Vehicle Photo Checklist</h2>
<div class="vehicle" id="vehicleLabel">Vehicle: --</div>

<div id="stepsContainer"></div>

<button id="submitBtn" disabled>Upload All Photos</button>
<div id="statusMsg"></div>

<script>
const tg = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;

window.onerror = function(msg, url, line) {
  const el = document.getElementById('statusMsg');
  if (el) el.textContent = 'JS Error: ' + msg + ' (line ' + line + ')';
};

if (!tg) {
  document.getElementById('vehicleLabel').textContent =
    'Please open this from the button inside your Telegram group — not a direct link.';
} else {
  tg.ready();
  tg.expand();
}

const urlParams = new URLSearchParams(window.location.search);

// start_param comes from the t.me deep link (?startapp=cXXXXXX) — this is how
// group-launched Mini Apps receive context, since web_app buttons don't work in groups.
const startParam = (tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param) || '';
const chatId = startParam.startsWith('c') ? startParam.slice(1) : (urlParams.get('chatId') || '');

if (tg) {
  document.getElementById('vehicleLabel').textContent = chatId
    ? 'Uploading for this group\'s vehicle'
    : 'Vehicle: unknown — open this via the reminder button in your vehicle group';
}

const STEPS = ['Front', 'Left', 'Right', 'Back', 'Odometer'];
const captured = {}; // step -> { base64, mimeType, lat, lng }

const container = document.getElementById('stepsContainer');
STEPS.forEach(step => {
  const row = document.createElement('div');
  row.className = 'step';
  row.id = 'row-' + step;
  row.innerHTML = `
    <div>
      <div class="step-label">${step}</div>
      <div class="step-status" id="status-${step}">Not captured</div>
    </div>
    <div>
      <input type="file" accept="image/*" capture="environment" id="input-${step}">
      <button class="capture" id="btn-${step}">Capture</button>
    </div>
  `;
  container.appendChild(row);

  const btn = document.getElementById(`btn-${step}`);
  const input = document.getElementById(`input-${step}`);

  btn.addEventListener('click', () => input.click());
  input.addEventListener('change', () => handleCapture(step, input));
});

function handleCapture(step, input) {
  const file = input.files[0];
  if (!file) return;

  document.getElementById(`status-${step}`).textContent = 'Getting location...';

  navigator.geolocation.getCurrentPosition(
    pos => {
      const reader = new FileReader();
      reader.onload = () => {
        const base64 = reader.result.split(',')[1];
        captured[step] = {
          step,
          base64,
          mimeType: file.type,
          lat: pos.coords.latitude,
          lng: pos.coords.longitude
        };
        markDone(step);
      };
      reader.readAsDataURL(file);
    },
    err => {
      // still allow capture without GPS rather than blocking the driver entirely,
      // but flag it so it's visible in the log / to admin
      const reader = new FileReader();
      reader.onload = () => {
        const base64 = reader.result.split(',')[1];
        captured[step] = { step, base64, mimeType: file.type, lat: '', lng: '' };
        markDone(step, true);
      };
      reader.readAsDataURL(file);
    },
    { enableHighAccuracy: true, timeout: 8000 }
  );
}

function markDone(step, gpsFailed) {
  const row = document.getElementById('row-' + step);
  row.classList.add('done');
  document.getElementById(`status-${step}`).textContent = gpsFailed ? 'Captured (no GPS)' : 'Captured ✓';
  document.getElementById(`btn-${step}`).textContent = 'Retake';
  checkAllDone();
}

function checkAllDone() {
  const submitBtn = document.getElementById('submitBtn');
  submitBtn.disabled = Object.keys(captured).length !== STEPS.length;
}

document.getElementById('submitBtn').addEventListener('click', submitAll);

function submitAll() {
  const submitBtn = document.getElementById('submitBtn');
  const statusMsg = document.getElementById('statusMsg');
  submitBtn.disabled = true;
  statusMsg.textContent = 'Uploading...';

  const payload = {
    action: 'upload_photos',
    chatId,
    initData: tg ? tg.initData : '',
    items: STEPS.map(s => captured[s])
  };

  fetch('WEB_APP_URL_PLACEHOLDER', {
    method: 'POST',
    body: JSON.stringify(payload)
  })
    .then(r => r.json())
    .then(res => {
      if (res.ok) {
        statusMsg.textContent = 'Uploaded successfully ✓';
        setTimeout(() => { if (tg) tg.close(); }, 1200);
      } else {
        statusMsg.textContent = 'Upload failed: ' + (res.error || 'unknown error');
        submitBtn.disabled = false;
      }
    })
    .catch(err => {
      statusMsg.textContent = 'Network error, please retry.';
      submitBtn.disabled = false;
    });
}
</script>
</body>
</html>
